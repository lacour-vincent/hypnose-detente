apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.lacour.vincent.hypnosedetente"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 31
        versionName "1.6.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    assetPacks = [":adaptation_aux_virus", ":auto_hypnose", ":bain_d_hypnose", ":bien_dormir", ":calmer_l_anxiete",
                  ":confiance_en_soi", ":createur_de_realite", ":curatif", ":estime_de_soi", ":expansion", ":gerer_le_stress",
                  ":histoire_de_la_vie", ":immersion_sensorielle", ":intuition", ":la_conscience", ":l_inconscient", ":magie_interieur",
                  ":preventif", ":ressourcement", ":retrouver_le_moral", ":reussir_sa_vie", ":s_endormir", ":soigner_son_passe", ":transformer_vos_peurs"]

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.play:core:1.9.1'
    implementation 'com.google.android.play:core-ktx:1.8.1'

    implementation 'de.hdodenhof:circleimageview:3.0.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.11.8'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    implementation 'com.google.firebase:firebase-analytics:18.0.2'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
