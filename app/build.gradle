apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.lacour.vincent.hypnosedetente"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 34
        versionName "1.7.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    assetPacks = [":adaptation_aux_virus", ":addictions", ":auto_hypnose", ":bain_d_hypnose", ":bien_dormir",
                  ":calmer_l_anxiete", ":confiance_en_soi", ":createur_de_realite", ":curatif", ":estime_de_soi",
                  ":expansion", ":faire_son_deuil", ":gerer_le_stress", ":gerer_la_douleur", ":histoire_de_la_vie",
                  ":immersion_sensorielle", ":intuition", ":joie_de_vivre", ":la_conscience", ":l_inconscient",
                  ":magie_interieur", ":nouveau_depart", ":pensees_negatives", ":preventif", ":prise_de_decision",
                  ":reeducation_physique", ":renforcement", ":ressourcement", ":retrouver_le_moral", ":retrouver_sa_confiance",
                  ":reussir_sa_vie", ":s_endormir", ":soigner_son_passe", ":surmonter_sa_tristesse", ":transformer_vos_peurs",
                  ":voyage_en_imagination"]
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.play:core:1.10.0'
    implementation 'com.google.android.play:core-ktx:1.8.1'

    implementation 'de.hdodenhof:circleimageview:3.0.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.13.3'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    implementation 'com.google.firebase:firebase-analytics:18.0.3'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
